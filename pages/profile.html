<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/profile.css">
</head>

<body>
  <main class="profile">

    <header class="dash-header text-center position-relative">
      <button class="profile__back" onclick="window.location.href='./home.html'" aria-label="Voltar">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
      <div class="dash-header__pill">
        <h1 class="dash-header__title m-0">Editar Perfil</h1>
      </div>
    </header>

    <section class="profile__card container">

      <div class="profile__avatar-wrap">
        <img id="avatarPreview" class="profile__avatar" src="../assets/img/user-placeholder.png" alt="Sua foto">


        <input id="avatarInput" type="file" accept="image/*" capture="user" class="visually-hidden">


        <label for="avatarInput" class="profile__avatar-btn" title="Alterar foto">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              d="M12 5l1.8 2H17a2 2 0 012 2v7a2 2 0 01-2 2H7a2 2 0 01-2-2V9a2 2 0 012-2h3.2L12 5zm0 3.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9z"
              fill="currentColor" />
          </svg>
        </label>


        <button type="button" id="avatarRemove" class="profile__avatar-remove" title="Remover foto"
          aria-label="Remover foto">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="M16 8l-8 8M8 8l8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>


      <div class="profile__group">
        <label class="profile__label" for="nome">Nome Completo</label>
        <div class="profile__field">
          <input id="nome" type="text" class="profile__input" value="Carlos Henrique Souza" autocomplete="name">
        </div>
      </div>

      <div class="profile__group">
        <label class="profile__label" for="email">E-mail</label>
        <div class="profile__field">
          <input id="email" type="email" class="profile__input" value="carlos.souza@gmail.com" list="emails-sugeridos"
            autocomplete="email">
          <datalist id="emails-sugeridos">
            <option value="carlos.souza@gmail.com"></option>
            <option value="carlos.h.souza@outlook.com"></option>
            <option value="carlos.souza@yahoo.com"></option>
          </datalist>
        </div>
      </div>

      <div class="profile__group">
        <label class="profile__label" for="cel">Celular</label>
        <div class="profile__field">
          <input id="cel" type="tel" class="profile__input" value="(11) 98765-4321" autocomplete="tel">
        </div>
      </div>

      <p class="profile__hint text-center">Quer mudar sua senha?</p>
      <button class="profile__btn" type="button" onclick="changePassword()">Mudar senha</button>
      <button id="saveProfileBtn" class="btn btn-lg w-100 login__btn" type="button">Salvar</button>
    </section>
  </main>

  <script src="../js/profile.js" defer></script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
