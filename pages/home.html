<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swift • Bem-Vindo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/tokens.css" rel="stylesheet">
    <link href="../css/base.css" rel="stylesheet">
    <link href="../css/home.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <!-- Header em pílula -->
    <header class="dash-header text-center position-relative">
        <div class="dash-header__pill">
            <h1 class="dash-header__title m-0">Bem-Vindo</h1>
        </div>
    </header>

    <!-- Conteúdo -->
    <main class="container py-4">
        <div class="row g-3">
            <!-- Card Quiz -->
            <section class="col-12">
                <div class="card-soft quiz-card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-semibold">Quiz 2</span>
                        <span id="quizPercent" class="fw-bold">50%</span>
                    </div>
                    <div class="progress mt-3" role="progressbar" aria-label="Progresso do Quiz">
                        <div id="quizBar" class="progress-bar progress-bar-striped"></div>
                    </div>
                </div>
            </section>

            <!-- SWP + Rank atual -->
            <section class="col-6">
                <div class="card-soft kpi-card p-3 d-flex align-items-center gap-2">
                    <span class="badge bg-white text-dark fw-bold">SWP</span>
                    <span id="swpPoints" class="fs-4 fw-bold">1000</span>
                </div>
            </section>

            <section class="col-6">
                <div class="card-soft rank-card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-semibold">Rank atual</span>
                        <span id="myRank" class="position-badge">3</span>
                    </div>
                    <ul id="rankList" class="list-unstyled m-0 small"></ul>
                </div>
            </section>

            <!-- Streak -->
            <section class="col12 col-sm-6">
                <div class="card-soft streak-card p-3 text-center">
                    <img src="../assets/img/icons8-fogo-96.png" alt="Ícone de chama" class="streak-card__icon mb-2">
                    <div class="small text-white-50">STREAK DE <span id="streakDays">3</span> DIAS</div>
                </div>
            </section>

            <!-- Missão semanal -->
            <section class="col-12 col-sm-6">
                <div class="card-soft mission-card p-3">
                    <div class="fw-semibold mb-1">Missão Semanal</div>
                    <p id="missionText" class="mb-0 small text-muted"></p>
                </div>
            </section>
        </div>
    </main>

    <!-- Navbar inferior -->
    <nav class="dash-nav navbar fixed-bottom bg-white border-top">
        <div class="container d-flex justify-content-around py-2">
            <a class="nav-link active text-orange" href="./dashboard.html" aria-label="Início"><i
                    class="bi bi-house-fill fs-5"></i></a>
            <a class="nav-link text-orange" href="./ranking.html" aria-label="Troféus"><i
                    class="bi bi-trophy-fill fs-5"></i></a>
            <a class="nav-link text-orange" href="./flashcards.html" aria-label="Atividades"><i
                    class="bi bi-grid-3x3-gap-fill fs-5"></i></a>
            <a class="nav-link text-orange" href="./perfil.html" aria-label="Configurações"><i
                    class="bi bi-gear-fill fs-5"></i></a>
            <a class="nav-link text-orange" href="./profile.html" aria-label="Perfil"><i
                    class="bi bi-person-circle fs-5"></i></a>
        </div>
    </nav>

    <!-- Scripts -->
    <script type="module">
        import { requireAuth } from '../js/auth.js';
        requireAuth?.();

        // mocks + lógica da página
    </script>
    <script type="module" src="../js/mocks/homeData.js"></script>
    <script type="module" src="../js/home.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
