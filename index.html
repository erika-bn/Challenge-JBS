<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Swift</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <main class="login">
        <div class="login__wrap container d-flex align-items-center justify-content-center min-vh-100">
            <section class="login__card text-center">
                <img class="login__logo mb-4" src="./assets/img/logo-swift-gamificacao.png" alt="Swift">
                <form id="login-form" class="login__form needs-validation" novalidate>
                    <div class="mb-3 text-start">
                        <label for="login-email" class="form-label text-white-50 small mb-1">Login</label>
                        <input id="login-email" name="email" type="email" class="form-control login__input" required>
                        <div class="invalid-feedback">Informe um e-mail válido.</div>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="login-senha" class="form-label text-white-50 small mb-1">Senha</label>
                        <input id="login-senha" name="senha" type="password" class="form-control login__input"
                            minlength="6" required>
                        <div class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</div>
                    </div>
                    <button type="submit" class="btn btn-lg btn-primary w-100 login__btn">Entrar</button>
                    <div class="login__links d-flex justify-content-between align-items-center mt-3">
                        <a href="#" class="login__link">Criar conta</a>
                        <a href="#" class="login__link">Esqueci minha senha</a>
                    </div>
                </form>
            </section>
        </div>
    </main>
    <script type="module" src="./js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
